image: atlassian/default-image:4

pipelines:
  custom:
    flake-update:
      - step:
          name: Update flake.lock and auto-merge PR
          script:
            - |
              curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux --init none --no-confirm
              . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
              git config user.email "pipelines@bitbucket.org"
              git config user.name "Bitbucket Pipelines"
              export BRANCH_NAME="auto/flake-update-$(date +%Y-%m-%d)"
              git checkout -b "$BRANCH_NAME"
              nix flake update
              git add flake.lock
              git diff --cached --quiet && echo "No changes to flake.lock" && exit 0
              git commit -m "chore: nix flake update $(date +%Y-%m-%d)"
              git push origin "$BRANCH_NAME"
              echo "Creating PR..."
              export PR_RESPONSE=$(curl -sv -X POST -u "${BB_AUTH_USER}:${BB_AUTH_APP_PASSWORD}" -H "Content-Type:application/json" "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_FULL_NAME}/pullrequests" -d "{\"title\":\"chore: nix flake update $(date +%Y-%m-%d)\",\"source\":{\"branch\":{\"name\":\"${BRANCH_NAME}\"}},\"destination\":{\"branch\":{\"name\":\"main\"}},\"close_source_branch\":true}" 2>&1)
              echo "PR API response: ${PR_RESPONSE}"
              export PR_ID=$(echo "$PR_RESPONSE" | grep -o '"id": [0-9]*' | head -1 | grep -o '[0-9]*')
              echo "Created PR #${PR_ID}"
              if [ -z "$PR_ID" ]; then echo "ERROR: Failed to create PR"; exit 1; fi
              echo "Merging PR #${PR_ID}..."
              export MERGE_RESPONSE=$(curl -sv -X POST -u "${BB_AUTH_USER}:${BB_AUTH_APP_PASSWORD}" -H "Content-Type:application/json" "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_FULL_NAME}/pullrequests/${PR_ID}/merge" -d "{\"merge_strategy\":\"merge_commit\",\"close_source_branch\":true}" 2>&1)
              echo "Merge API response: ${MERGE_RESPONSE}"
              echo "PR #${PR_ID} merged successfully"
